name: Presentation website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL }}
  BUILD_COMMAND: ${{ vars.WEBSITE_BUILD_COMMAND || 'npm run build' }}
  OUTPUT_DIRECTORY: ${{ vars.WEBSITE_OUTPUT_DIRECTORY || 'dist' }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build static site
        run: $BUILD_COMMAND
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/${{ env.OUTPUT_DIRECTORY }}
          if-no-files-found: error

  deploy:
    needs: check
    if: >-
      vars.AZURE_DEPLOYMENT_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require configured production URL
        run: test -n "$SITE_URL" || { echo 'Set the SITE_URL repository variable before enabling deployment.'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: site-artifact
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site-artifact
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

  close-preview:
    if: >-
      vars.AZURE_DEPLOYMENT_ENABLED == 'true' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close